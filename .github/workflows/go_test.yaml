name: Test
on: [push, pull_request]
jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: pggen
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hunter2
        ports:
          - 5555:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: pggen
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: hunter2
        # 9010/8124 rather than the usual 9000/8123, matching
        # docker-compose.yml and internal/chtest.Addr.
        ports:
          - 9010:9000
          - 8124:8123
        options: >-
          --health-cmd "clickhouse-client --user default --password hunter2 --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
      - run: go test ./...
      - run: go test --tags=acceptance_test ./...
        env:
          DOCKER_API_VERSION: 1.39
